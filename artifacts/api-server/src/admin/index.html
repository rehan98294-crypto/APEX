<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Admin — Withdrawals</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    /* ── Login ── */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: #1a1d27; border: 1px solid #2d3142; border-radius: 16px; padding: 40px; width: 360px; }
    .login-logo { font-size: 28px; font-weight: 800; background: linear-gradient(90deg,#5cbffe,#2bd9a8,#ffb08a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .login-sub { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
    .login-label { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .login-input { width: 100%; background: #0f1117; border: 1px solid #2d3142; border-radius: 10px; padding: 12px 16px; color: #e2e8f0; font-size: 15px; outline: none; }
    .login-input:focus { border-color: #5cbffe; }
    .login-btn { width: 100%; margin-top: 20px; padding: 14px; border-radius: 10px; border: none; background: linear-gradient(90deg,#5cbffe,#2bd9a8); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
    .login-err { color: #f87171; font-size: 13px; margin-top: 10px; display: none; }

    /* ── Main App ── */
    #app-screen { display: none; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; background: #1a1d27; border-bottom: 1px solid #2d3142; position: sticky; top: 0; z-index: 10; }
    .topbar-brand { font-size: 20px; font-weight: 800; background: linear-gradient(90deg,#5cbffe,#2bd9a8,#ffb08a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .logout-btn { background: none; border: 1px solid #2d3142; border-radius: 8px; color: #94a3b8; padding: 7px 14px; font-size: 13px; cursor: pointer; }
    .logout-btn:hover { border-color: #f87171; color: #f87171; }

    /* ── Stats bar ── */
    .stats-bar { display: flex; gap: 16px; padding: 20px 28px; flex-wrap: wrap; }
    .stat-card { flex: 1; min-width: 140px; background: #1a1d27; border: 1px solid #2d3142; border-radius: 14px; padding: 18px 22px; }
    .stat-label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .stat-value { font-size: 26px; font-weight: 800; }
    .stat-sub { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .pending-color { color: #f59e0b; }
    .approved-color { color: #2bd9a8; }
    .rejected-color { color: #f87171; }

    /* ── Controls ── */
    .controls { display: flex; align-items: center; gap: 12px; padding: 0 28px 16px; flex-wrap: wrap; }
    .filter-btn { padding: 8px 18px; border-radius: 8px; border: 1px solid #2d3142; background: transparent; color: #94a3b8; font-size: 14px; cursor: pointer; transition: all .15s; }
    .filter-btn:hover { border-color: #5cbffe; color: #5cbffe; }
    .filter-btn.active { background: linear-gradient(90deg,#5cbffe,#2bd9a8); border-color: transparent; color: #fff; font-weight: 700; }
    .refresh-btn { margin-left: auto; padding: 8px 18px; border-radius: 8px; border: 1px solid #2d3142; background: transparent; color: #5cbffe; font-size: 14px; cursor: pointer; }
    .refresh-btn:hover { background: #5cbffe22; }

    /* ── Cards grid ── */
    .cards-wrap { padding: 0 28px 40px; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .w-card { background: #1a1d27; border: 1px solid #2d3142; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
    .w-card:hover { border-color: #3d4256; }
    .w-card-header { display: flex; align-items: center; justify-content: space-between; }
    .w-id { font-size: 11px; color: #64748b; font-family: monospace; }
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .status-pending  { background: #f59e0b22; color: #f59e0b; border: 1px solid #f59e0b44; }
    .status-approved { background: #2bd9a822; color: #2bd9a8; border: 1px solid #2bd9a844; }
    .status-rejected { background: #f8717122; color: #f87171; border: 1px solid #f8717144; }

    .w-amount { font-size: 28px; font-weight: 800; color: #e2e8f0; }
    .w-amount span { font-size: 14px; color: #94a3b8; font-weight: 400; margin-left: 4px; }

    .w-rows { display: flex; flex-direction: column; gap: 6px; }
    .w-row { display: flex; justify-content: space-between; font-size: 13px; }
    .w-row-label { color: #64748b; }
    .w-row-val { color: #cbd5e1; font-family: monospace; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
    .addr-val { color: #5cbffe; }

    .w-actions { display: flex; gap: 10px; margin-top: 4px; }
    .approve-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; background: linear-gradient(90deg,#2bd9a8,#5cbffe); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
    .approve-btn:hover { opacity: .88; }
    .reject-btn  { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #f87171; background: transparent; color: #f87171; font-size: 14px; font-weight: 700; cursor: pointer; }
    .reject-btn:hover { background: #f8717122; }
    .btn-disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }

    /* ── Empty / Loading ── */
    .empty-state { text-align: center; padding: 60px 20px; color: #475569; }
    .empty-icon { font-size: 48px; margin-bottom: 14px; }
    .loading-text { text-align: center; padding: 40px; color: #475569; }

    /* ── Toast ── */
    #toast { position: fixed; bottom: 28px; right: 28px; background: #1a1d27; border: 1px solid #2d3142; border-radius: 12px; padding: 14px 22px; font-size: 14px; color: #e2e8f0; display: none; z-index: 9999; animation: slideUp .2s ease; box-shadow: 0 8px 32px #0008; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast-success { border-color: #2bd9a8; }
    .toast-error   { border-color: #f87171; }
  </style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Apex</div>
    <div class="login-sub">Admin Panel — Withdrawals</div>
    <div class="login-label">Admin Secret</div>
    <input id="secret-input" class="login-input" type="password" placeholder="Enter admin secret" />
    <button class="login-btn" onclick="doLogin()">Access Panel</button>
    <div class="login-err" id="login-err">Invalid secret. Access denied.</div>
  </div>
</div>

<!-- ── MAIN APP ───────────────────────────────────────────────────────────── -->
<div id="app-screen">
  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-brand">⬡ Apex Admin</div>
    <div class="topbar-right">
      <span style="font-size:13px;color:#64748b" id="last-updated"></span>
      <button class="logout-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">Pending</div>
      <div class="stat-value pending-color" id="stat-pending-count">—</div>
      <div class="stat-sub" id="stat-pending-total">$0.00 total</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Approved</div>
      <div class="stat-value approved-color" id="stat-approved-count">—</div>
      <div class="stat-sub" id="stat-approved-total">$0.00 total</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Rejected</div>
      <div class="stat-value rejected-color" id="stat-rejected-count">—</div>
      <div class="stat-sub" id="stat-rejected-total">$0.00 total</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="filter-btn active" data-filter="pending"  onclick="setFilter('pending')">⏳ Pending</button>
    <button class="filter-btn"        data-filter="approved" onclick="setFilter('approved')">✅ Approved</button>
    <button class="filter-btn"        data-filter="rejected" onclick="setFilter('rejected')">❌ Rejected</button>
    <button class="filter-btn"        data-filter="all"      onclick="setFilter('all')">📋 All</button>
    <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
  </div>

  <!-- Cards -->
  <div class="cards-wrap">
    <div id="cards-loading" class="loading-text">Loading…</div>
    <div id="cards-grid" class="cards-grid" style="display:none"></div>
    <div id="cards-empty" class="empty-state" style="display:none">
      <div class="empty-icon">📭</div>
      <div>No withdrawals in this category</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const API = window.location.origin + '/api';
  let adminSecret = '';
  let currentFilter = 'pending';

  // ── Auth ───────────────────────────────────────────────────────────────────
  function authHeaders() {
    return { 'Authorization': 'Bearer ' + adminSecret, 'Content-Type': 'application/json' };
  }

  async function doLogin() {
    const val = document.getElementById('secret-input').value.trim();
    if (!val) return;
    // Test by calling stats endpoint
    const r = await fetch(API + '/admin/stats', { headers: { 'Authorization': 'Bearer ' + val } });
    if (r.ok) {
      adminSecret = val;
      sessionStorage.setItem('apex_admin_secret', val);
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      loadAll();
    } else {
      document.getElementById('login-err').style.display = 'block';
    }
  }

  function doLogout() {
    adminSecret = '';
    sessionStorage.removeItem('apex_admin_secret');
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('secret-input').value = '';
    document.getElementById('login-err').style.display = 'none';
  }

  // Auto-restore session
  window.addEventListener('DOMContentLoaded', () => {
    const saved = sessionStorage.getItem('apex_admin_secret');
    if (saved) {
      adminSecret = saved;
      fetch(API + '/admin/stats', { headers: { 'Authorization': 'Bearer ' + saved } }).then(r => {
        if (r.ok) {
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('app-screen').style.display = 'block';
          loadAll();
        } else { adminSecret = ''; }
      });
    }

    // Enter key on login
    document.getElementById('secret-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });

  // ── Toast ──────────────────────────────────────────────────────────────────
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast-' + type;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3500);
  }

  // ── Filter ─────────────────────────────────────────────────────────────────
  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === f);
    });
    loadWithdrawals();
  }

  // ── Load all ───────────────────────────────────────────────────────────────
  async function loadAll() {
    loadStats();
    loadWithdrawals();
  }

  async function loadStats() {
    try {
      const r = await fetch(API + '/admin/stats', { headers: authHeaders() });
      const d = await r.json();
      document.getElementById('stat-pending-count').textContent  = d.pending?.count ?? 0;
      document.getElementById('stat-approved-count').textContent = d.approved?.count ?? 0;
      document.getElementById('stat-rejected-count').textContent = d.rejected?.count ?? 0;
      document.getElementById('stat-pending-total').textContent  = '$' + (d.pending?.total ?? 0).toFixed(2) + ' total';
      document.getElementById('stat-approved-total').textContent = '$' + (d.approved?.total ?? 0).toFixed(2) + ' sent';
      document.getElementById('stat-rejected-total').textContent = '$' + (d.rejected?.total ?? 0).toFixed(2) + ' refunded';
    } catch {}
  }

  async function loadWithdrawals() {
    const grid    = document.getElementById('cards-grid');
    const empty   = document.getElementById('cards-empty');
    const loading = document.getElementById('cards-loading');

    grid.style.display = 'none';
    empty.style.display = 'none';
    loading.style.display = 'block';

    try {
      const r = await fetch(API + '/admin/withdrawals?status=' + currentFilter, { headers: authHeaders() });
      const d = await r.json();
      const items = d.withdrawals ?? [];

      loading.style.display = 'none';

      const ts = new Date().toLocaleTimeString();
      document.getElementById('last-updated').textContent = 'Updated ' + ts;

      if (items.length === 0) {
        empty.style.display = 'block';
        return;
      }

      grid.innerHTML = items.map(renderCard).join('');
      grid.style.display = 'grid';
    } catch (e) {
      loading.textContent = 'Failed to load. Check connection.';
    }
  }

  function renderCard(w) {
    const isPending = w.status === 'pending';
    const date = new Date(w.created_at).toLocaleString();
    const fee  = w.fee ?? (w.amount * 0.05);
    const recv = (w.amount - fee).toFixed(2);
    const username = w.users?.username ?? '—';
    const email    = w.users?.email    ?? '—';
    const shortId  = w.id.slice(0, 8) + '…';

    const actionBtns = isPending ? `
      <div class="w-actions">
        <button class="approve-btn" onclick="approve('${w.id}')">✅ Approve</button>
        <button class="reject-btn"  onclick="rejectWithReason('${w.id}', '${w.amount}')">❌ Reject</button>
      </div>` : '';

    return `
    <div class="w-card" id="card-${w.id}">
      <div class="w-card-header">
        <span class="w-id">#${shortId}</span>
        <span class="status-badge status-${w.status}">${w.status.toUpperCase()}</span>
      </div>
      <div class="w-amount">$${parseFloat(w.amount).toFixed(2)} <span>USDT</span></div>
      <div class="w-rows">
        <div class="w-row"><span class="w-row-label">User</span><span class="w-row-val">${username} (${email})</span></div>
        <div class="w-row"><span class="w-row-label">Network</span><span class="w-row-val">${w.network}</span></div>
        <div class="w-row"><span class="w-row-label">Wallet Address</span><span class="w-row-val addr-val" title="${w.wallet_address}">${w.wallet_address}</span></div>
        <div class="w-row"><span class="w-row-label">Fee (5%)</span><span class="w-row-val" style="color:#f59e0b">-$${parseFloat(fee).toFixed(2)}</span></div>
        <div class="w-row"><span class="w-row-label">User Receives</span><span class="w-row-val" style="color:#2bd9a8">$${recv}</span></div>
        <div class="w-row"><span class="w-row-label">Submitted</span><span class="w-row-val">${date}</span></div>
        <div class="w-row"><span class="w-row-label">Withdrawal ID</span><span class="w-row-val" style="font-size:11px">${w.id}</span></div>
      </div>
      ${actionBtns}
    </div>`;
  }

  // ── Actions ────────────────────────────────────────────────────────────────
  async function approve(id) {
    const card = document.getElementById('card-' + id);
    const btns = card.querySelectorAll('button');
    btns.forEach(b => b.classList.add('btn-disabled'));

    try {
      const r = await fetch(API + '/admin/withdrawals/' + id + '/approve', {
        method: 'POST', headers: authHeaders()
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error ?? 'Failed');
      showToast('✅ Withdrawal approved successfully');
      setTimeout(loadAll, 800);
    } catch (e) {
      showToast('❌ ' + e.message, 'error');
      btns.forEach(b => b.classList.remove('btn-disabled'));
    }
  }

  async function rejectWithReason(id, amount) {
    const reason = prompt(`Reject withdrawal of $${amount}?\n\nOptional reason:`);
    if (reason === null) return; // cancelled
    await reject(id, reason);
  }

  async function reject(id, reason = '') {
    const card = document.getElementById('card-' + id);
    const btns = card.querySelectorAll('button');
    btns.forEach(b => b.classList.add('btn-disabled'));

    try {
      const r = await fetch(API + '/admin/withdrawals/' + id + '/reject', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ reason })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error ?? 'Failed');
      showToast('❌ Withdrawal rejected — $' + d.refunded + ' refunded to user');
      setTimeout(loadAll, 800);
    } catch (e) {
      showToast('Error: ' + e.message, 'error');
      btns.forEach(b => b.classList.remove('btn-disabled'));
    }
  }
</script>
</body>
</html>
